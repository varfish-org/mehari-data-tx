name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # a check run on demand, e.g. after CI was disabled while merging a stack
  workflow_dispatch:
  # release-please.yml calls this workflow to upload the databases to a release
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      version:
        type: string
        required: true

# cf. https://github.com/mamba-org/provision-with-micromamba#important
defaults:
  run:
    shell: bash -el {0}

env:
  MEHARI_VERSION: "0.47.0"
  MINIFORGE_VERSION: "26.7.2-1"
  SNAKEMAKE_OUTPUT_CACHE: "${{ github.workspace }}/snakemake_cache"

# One job per database keeps each job within the disk space of a runner (about 14 GB).
jobs:
  # lists the databases and prepares the inputs that all database checks share,
  # so that the build jobs download neither ClinVar (4.5 GB) nor HGNC and HPO
  prepare:
    runs-on: ubuntu-latest
    # skip job if it is a Release Please PR, unless called to build the release assets
    if: |
      inputs.tag_name || (
        !startsWith(github.head_ref, 'release-please--') &&
        !startsWith(github.event.head_commit.message, 'chore(main): release')
      )
    outputs:
      build: ${{ steps.aliases.outputs.build }}
      merge: ${{ steps.aliases.outputs.merge }}
    steps:
      - uses: actions/checkout@v7

      - &cache-conda
        name: Cache conda
        uses: actions/cache@v6
        env:
          # Increase this value to reset cache if etc/example-environment.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yaml') }}

      - &setup-snakemake
        name: Setup Miniconda and snakemake
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          # a fixed conda, so that a new release cannot break CI unnoticed
          miniforge-version: ${{ env.MINIFORGE_VERSION }}
          auto-update-conda: false
          conda-solver: "libmamba"
          python-version: 3.12
          environment-file: "environment.yaml"
          conda-remove-defaults: "true"

      - name: List databases
        id: aliases
        run: |
          snakemake --workflow-profile none --configfile config/config.yaml --cores 1 results/aliases.json
          echo "build=$(jq -c .build results/aliases.json)" >> "$GITHUB_OUTPUT"
          echo "merge=$(jq -c .merge results/aliases.json)" >> "$GITHUB_OUTPUT"

      - name: Prepare shared inputs
        run: |
          # without the snakemake output cache, so that the outputs are files and not links into the cache
          snakemake --workflow-profile none --sdm conda --configfile config/config.yaml --show-failed-logs --cores 4 \
            results/clinvar/clinvar-txAcc-count.tsv \
            results/clinvar/clinvar-hgnc-id-counts.tsv \
            results/hgnc/hgnc_complete_set.json \
            results/human-phenotype-ontology/genes_to_disease_with_hgnc_id.tsv

      - name: Keep shared inputs for the build jobs
        uses: actions/upload-artifact@v7
        with:
          name: shared-inputs
          path: |
            results/clinvar/clinvar-txAcc-count.tsv
            results/clinvar/clinvar-hgnc-id-counts.tsv
            results/hgnc/hgnc_complete_set.json
            results/human-phenotype-ontology/genes_to_disease_with_hgnc_id.tsv
          retention-days: 1

  build_data_release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        alias: ${{ fromJSON(needs.prepare.outputs.build) }}
    steps:
      - uses: actions/checkout@v7

      - &setup-apptainer
        name: Setup apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt install -y apptainer squashfuse

      # See https://github.com/apptainer/apptainer/pull/2262
      - &disable-apparmor
        name: Disable apparmor namespace restrictions for apptainer
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 \
                      -w kernel.apparmor_restrict_unprivileged_userns=0 \
                      -w kernel.unprivileged_userns_clone=1

      - name: Cache snakemake cache directory
        id: cache-snakemake
        uses: actions/cache@v6
        with:
          path: |
            ~/snakemake_cache
            ${{ github.workspace }}/snakemake_cache
          key: snakemake-cache-${{ matrix.alias }}-${{ github.sha }}
          restore-keys: |
            snakemake-cache-${{ matrix.alias }}-

      - *cache-conda

      - *setup-snakemake

      - name: Download shared inputs
        uses: actions/download-artifact@v8
        with:
          name: shared-inputs
          path: results

      # The downloaded files have no snakemake metadata. Each derived file must be newer
      # than its inputs, or snakemake rebuilds it, including the ClinVar download.
      - name: Mark shared inputs as up to date
        run: |
          touch results/clinvar/*.tsv results/human-phenotype-ontology/genes_to_disease_with_hgnc_id.tsv

      - name: Run data build workflow
        shell: bash -el {0}
        run: |
          mkdir -p ~/snakemake_cache
          mkdir -p ${{ github.workspace }}/snakemake_cache
          # the check requires the database, its report and their checksums
          snakemake --verbose --configfile config/config.yaml --workflow-profile workflow/profiles/default --show-failed-logs --cores 4 --jobs 4 results/${{ matrix.alias }}/mehari/seqrepo/report/mehari_db_check.txt

      - name: List files
        run: |
          tree -f ~/work/mehari-data-tx/mehari-data-tx

      - name: Keep database for the merge job
        uses: actions/upload-artifact@v7
        with:
          name: db-${{ matrix.alias }}
          path: results/${{ matrix.alias }}/mehari/seqrepo/
          retention-days: 1

      - &upload-release-assets
        name: Upload release assets
        if: inputs.tag_name
        run: |
          set -x
          src_prefix=results/${{ matrix.alias }}/mehari/seqrepo/txs.bin
          dst_prefix=~/mehari-data-txs-${{ matrix.alias }}-${{ inputs.version }}.bin
          exts=".zst .zst.sha256"
          # merged databases have no report
          if [ -e "$src_prefix.zst.report.jsonl" ]; then
            exts="$exts .zst.report.jsonl .zst.report.jsonl.sha256"
          fi
          for ext in $exts; do
            cp "$src_prefix$ext" "$dst_prefix$ext"
            # --clobber, so that a rerun of a failed job can upload again
            gh release upload --clobber ${{ inputs.tag_name }} "$dst_prefix$ext"
          done
        env:
          # GitHub provides this variable in the CI env. You don't
          # need to add anything to the secrets vault.
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}

  merge_data_release:
    needs: [prepare, build_data_release]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.merge) }}
    steps:
      - uses: actions/checkout@v7

      - *setup-apptainer

      - *disable-apparmor

      - *cache-conda

      - *setup-snakemake

      - name: Download Ensembl database
        uses: actions/download-artifact@v8
        with:
          name: db-${{ matrix.ensembl }}
          path: results/${{ matrix.ensembl }}/mehari/seqrepo

      - name: Download RefSeq database
        uses: actions/download-artifact@v8
        with:
          name: db-${{ matrix.refseq }}
          path: results/${{ matrix.refseq }}/mehari/seqrepo

      - name: Merge databases
        run: |
          mkdir -p ${{ github.workspace }}/snakemake_cache
          # only merge: the downloaded databases and checks have no snakemake metadata and must not be rebuilt
          snakemake --allowed-rules mehari_merge_txs_dbs_per_assembly calculate_sha256_sum --verbose --configfile config/config.yaml --workflow-profile workflow/profiles/default --show-failed-logs --cores 4 --jobs 4 results/${{ matrix.alias }}/mehari/seqrepo/txs.bin.zst.sha256

      - *upload-release-assets

  # The one check for the branch protection, independent of the databases in the matrix.
  result:
    name: CI result
    needs: [prepare, build_data_release, merge_data_release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        env:
          PREPARE: ${{ needs.prepare.result }}
          BUILD: ${{ needs.build_data_release.result }}
          MERGE: ${{ needs.merge_data_release.result }}
        run: |
          echo "prepare: $PREPARE, build: $BUILD, merge: $MERGE"
          # prepare is skipped on purpose for release-please pull requests and commits
          if [ "$PREPARE" = skipped ]; then
            exit 0
          fi
          [ "$PREPARE" = success ] && [ "$BUILD" = success ] && [ "$MERGE" = success ]
