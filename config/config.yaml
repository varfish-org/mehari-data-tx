# reference sequence definitions
reference:
  GRCh38:
    ensembl:
      species: homo_sapiens
      # Ensembl releases to build a database for, each named {assembly}-ensembl-{release}.
      # The highest one is used wherever one Ensembl release is needed:
      # for RefSeq (sequences, chrMT, grafted transcripts) and the merged database.
      # cdot must provide each release for the configured cdot release (see sources below),
      # otherwise the cdot download fails.
      # check https://github.com/SACGF/cdot/releases for available versions.
      releases: [115, 116]
      build: GRCh38
      datatypes: [cdna, ncrna]
    refseq:
      # RefSeq transcript sequences (rna.fna) of the annotation release; '{refseq_release}' is replaced by each release.
      # check https://ftp.ncbi.nlm.nih.gov/genomes/all/annotation_releases/9606/ for available releases.
      fasta: https://ftp.ncbi.nlm.nih.gov/genomes/all/annotation_releases/9606/GCF_000001405.40-{refseq_release}/GCF_000001405.40_GRCh38.p14_rna.fna.gz
      # RefSeq annotation releases to build a database for, each named {assembly}-refseq-{release}.
      # The last one is used wherever one RefSeq release is needed:
      # for the RefSeq sequences of the Ensembl databases and the merged database.
      # cdot must provide each release, as for Ensembl.
      releases: [RS_2025_08]
#      build: GCF_000001405.40_GRCh38.p14
#      version: 110
#      taxon_id: 9606
  GRCh37:
    ensembl:
      species: homo_sapiens
      releases: [87]
      build: GRCh37
      datatypes: [cdna, ncrna]
    refseq:
      fasta: https://ftp.ncbi.nlm.nih.gov/genomes/all/annotation_releases/9606/{refseq_release}/GCF_000001405.25_GRCh37.p13/GCF_000001405.25_GRCh37.p13_rna.fna.gz
      releases: ["105.20220307"]


